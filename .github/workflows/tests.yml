name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit, integration and security tests
        run: python -m pytest -q
      - name: Validate SKILL.md with the Agent Skills reference validator
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install skills-ref
          mkdir -p /tmp/skill && git ls-files | tar -cf - -T - | tar -xf - -C /tmp/skill
          mv /tmp/skill /tmp/intelligent-agent-security-auditor
          agentskills validate /tmp/intelligent-agent-security-auditor
      - name: CLI smoke test (static audit of the lab must be NOT_READY = exit 20)
        run: |
          set +e
          agent-security-auditor audit examples/vulnerable-agent-lab -q
          test $? -eq 20
          agent-security-auditor audit examples/secure-agent -q
          test $? -eq 0

  sandbox-isolated:
    # Runs CONTROLLED DYNAMIC tests inside a container WITHOUT network, so the real isolation
    # pre-check passes. Nothing from an audited third-party repository is executed here: the
    # harnesses are this project's own synthetic examples.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheels (with network, outside the sandbox)
        run: |
          python -m pip wheel --no-deps --wheel-dir wheels .
          python -m pip download --dest wheels --only-binary=:all: --python-version 3.12 \
            --platform manylinux2014_x86_64 --platform manylinux_2_17_x86_64 "PyYAML>=6.0"
          ls wheels
      - name: Run dynamic scenarios with --network none
        run: |
          docker run --rm --network none --user 1001:1001 -e HOME=/tmp -v "$PWD":/w:ro -w /tmp python:3.12-slim sh -c '
            python -m venv /tmp/v && /tmp/v/bin/pip install --no-index --find-links /w/wheels intelligent-agent-security-auditor -q &&
            /tmp/v/bin/agent-security-auditor test /w/examples/secure-agent --harness sandbox_harness.py --scope /w/examples/secure-agent/scope.yaml --authorize &&
            { /tmp/v/bin/agent-security-auditor test /w/examples/vulnerable-agent-lab --harness sandbox_harness.py --scope /w/examples/vulnerable-agent-lab/scope.yaml --authorize; test $? -eq 20; }'
