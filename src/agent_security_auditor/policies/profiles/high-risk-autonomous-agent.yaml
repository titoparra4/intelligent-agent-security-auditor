# High-Risk Autonomous Agent policy - unattended agents with irreversible actions.
# Declarations alone are NOT accepted as evidence and behavioral (dynamic) controls are mandatory,
# so a static-only audit can at best reach INSUFFICIENT_EVIDENCE.
policy_version: "1.0"
name: high-risk-autonomous-agent
description: Unattended agent with irreversible actions. Requires code-level evidence and controlled dynamic tests.
forbidden_operations: [admin]
permissions:
  allow_admin: false
data:
  restricted: [pii, financial, credentials, health, confidential]
human_approval:
  required_for: [write, delete, send, execute, financial, infra, network]
isolation:
  require_per_user_memory: true
  require_sandboxed_code_execution: true
autonomy:
  require_max_iterations: true
blocking:
  severities: [CRITICAL, HIGH, MEDIUM]
  potential_severities: [CRITICAL, HIGH]
  require_acceptance_at: LOW
evidence:
  accept_declared: false
mandatory_controls:
  - CTRL-ARCH-01
  - CTRL-ARCH-02
  - CTRL-DATA-01
  - CTRL-DATA-02
  - CTRL-DATA-03
  - CTRL-DATA-04
  - CTRL-PI-01
  - CTRL-PI-02
  - CTRL-PI-03
  - CTRL-PERM-01
  - CTRL-PERM-02
  - CTRL-PERM-03
  - CTRL-EXF-01
  - CTRL-EXF-02
  - CTRL-AUTO-01
  - CTRL-AUTO-02
  - CTRL-AUTO-03
  - CTRL-AUTO-04
  - CTRL-MEM-01
  - CTRL-MEM-02
  - CTRL-SUP-01
  - CTRL-SUP-02
  - CTRL-MCP-01
  - CTRL-MCP-02
  - CTRL-MCP-03
  - CTRL-MCP-04
  - CTRL-MCP-05
  - CTRL-MA-01
  - CTRL-MA-02
  - CTRL-PI-B1
  - CTRL-EXF-B1
  - CTRL-AUTO-B1
  - CTRL-MEM-B1
  - CTRL-ADV-01
