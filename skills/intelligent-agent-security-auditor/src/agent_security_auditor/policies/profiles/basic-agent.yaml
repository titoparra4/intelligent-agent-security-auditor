# Basic Agent policy - minimum bar for any agent with tools.
# Design controls only; manifest declarations are accepted as evidence.
policy_version: "1.0"
name: basic-agent
description: Minimum security bar for a single agent with tools. Static design controls; declared evidence accepted.
human_approval:
  required_for: [send, delete, execute, financial, infra]
isolation:
  require_per_user_memory: true
  require_sandboxed_code_execution: true
autonomy:
  require_max_iterations: true
blocking:
  severities: [CRITICAL, HIGH]
  potential_severities: [CRITICAL]
  require_acceptance_at: MEDIUM
evidence:
  accept_declared: true
mandatory_controls:
  - CTRL-ARCH-01
  - CTRL-DATA-01
  - CTRL-PI-01
  - CTRL-PERM-01
  - CTRL-EXF-01
  - CTRL-AUTO-01
  - CTRL-AUTO-03
  - CTRL-MCP-03
